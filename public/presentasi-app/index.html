<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Presentasi AR</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">AR</div>
        <div><div class="brand-title">Presentasi AR</div><div class="brand-sub">AR Workspace · Finance</div></div>
      </div>
      <div class="tb-group">
        <select class="select" id="month" title="Bulan laporan"></select>
        <button class="btn ghost" data-act="datacenter" id="dataStatus" title="Status data"><span class="status-dot"></span><span>Data</span></button>
      </div>
      <div class="tb-spacer"></div>
      <div class="tb-group">
        <button class="btn" data-act="datacenter">
          <svg viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>
          Data Center
        </button>
        <div class="menu" id="exportMenu">
          <button class="btn" data-act="export-menu">
            <svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>Export
          </button>
          <div class="menu-list">
            <button data-act="export-pdf"><span>PDF (semua slide)</span><small>Cetak / Simpan sebagai PDF</small></button>
            <button data-act="export-xlsx"><span>Excel lengkap</span><small>Seri metrik, sumber angka, detail BP, tabel manual</small></button>
            <button data-act="export-json"><span>Snapshot data (.json)</span><small>Bawa presentasi ke laptop lain</small></button>
            <button data-act="export-template"><span>Template input manual</span><small>Excel untuk diisi lalu di-import</small></button>
          </div>
        </div>
        <button class="btn" data-act="edit" id="editBtn" title="Edit teks di slide (E)">
          <svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M14 6l4 4"/></svg>Edit teks
        </button>
        <button class="btn icon ghost" data-act="theme" title="Tema terang/gelap (T)">
          <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <button class="btn icon ghost" data-act="notes" title="Catatan pembicara (N)">
          <svg viewBox="0 0 24 24"><path d="M4 4h16v12H8l-4 4z"/></svg>
        </button>
        <button class="btn primary" data-act="present">
          <svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg>Present
        </button>
      </div>
    </header>

    <nav class="rail" id="rail"></nav>

    <main class="main">
      <div class="stage-wrap" id="stageWrap"><div class="stage" id="stage"></div></div>
      <div class="notes" id="notes"></div>
      <div class="slide-foot-nav">
        <button class="btn icon ghost" data-act="prev" title="Sebelumnya (←)"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
        <span id="counter">–</span>
        <button class="btn icon ghost" data-act="next" title="Berikutnya (→)"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
        <span>·</span><span>Klik angka / chart / baris untuk detail · klik lagi untuk menutup</span>
      </div>
    </main>

    <aside class="drawer" id="drawer">
      <div class="drawer-inner">
        <div class="drawer-head">
          <div style="flex:1;min-width:0"><div class="eyebrow" id="drawerEyebrow">Detail</div><h2 id="drawerTitle">–</h2></div>
          <button class="btn icon ghost" data-act="drawer-close" title="Tutup (Esc)"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        </div>
        <div class="drawer-body" id="drawerBody"></div>
      </div>
    </aside>
  </div>

  <div class="modal" id="dc">
    <div class="modal-box">
      <div class="modal-head">
        <h2>Data Center</h2><span class="pill" id="dcState"></span>
        <div class="tb-spacer"></div>
        <button class="btn icon ghost" data-act="dc-close" title="Tutup"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="tabs" id="dcTabs"></div>
      <div class="modal-body" id="dcBody"></div>
    </div>
  </div>

  <div class="pbar" id="pbar"></div>
  <div class="phud" id="phud"><span id="phudCount"></span><span id="phudTime">00:00</span><span>← → pindah · D detail · N catatan · Esc keluar</span></div>
  <div class="busy" id="busy"><div class="box"><span class="spin"></span><span id="busyText">Memproses…</span></div></div>
  <div class="toast" id="toast"></div>
  <div class="print-root" id="printRoot"></div>
  <input type="file" id="fileInput" multiple accept=".xls,.xlsx,.xlsm,.json" hidden>

  <script src="vendor/echarts.min.js"></script>
  <script src="vendor/xlsx.full.min.js"></script>
  <script src="js/core/util.js"></script>
  <script src="js/data/parse.js"></script>
  <script src="js/data/state.js"></script>
  <script src="js/data/store.js"></script>
  <script src="js/data/export.js"></script>
  <script src="js/engine/metrics.js"></script>
  <script src="js/engine/insights.js"></script>
  <script src="js/ui/charts.js"></script>
  <script src="js/ui/drawer.js"></script>
  <script src="js/ui/slides-a.js"></script>
  <script src="js/ui/slides-b.js"></script>
  <script src="js/ui/datacenter.js"></script>
  <script src="js/ui/app.js"></script>
</body>
</html>
